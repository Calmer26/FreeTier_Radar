name: Image showcase

# Daily at 00:30 UTC, just after the Neuron reset: make the day's share of missing showcase images (each free
# image model draws the same test prompts once). Commits nothing once all exist.
on:
  # Started on time by the scheduler Worker (scheduler/schedule.ts); GitHub's cron was unreliable.
  workflow_dispatch:

concurrency:
  group: data-writes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  showcase:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run showcase
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Commit new images
        run: |
          # Nothing exists yet on a day that made no images (e.g. the free Neurons were already used).
          for f in data/showcase.json public/showcase; do if [ -e "$f" ]; then git add "$f"; fi; done
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git config user.name "freetier-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: image showcase $(date -u +%Y-%m-%d)"
          # Code may have been pushed while this job ran: rebase the data commit onto it.
          for attempt in 1 2 3; do git pull --rebase --quiet && git push && exit 0; sleep $((attempt * 10)); done; exit 1

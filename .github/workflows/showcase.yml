name: Showcase (images and voices)

# Daily at 00:30 UTC, just after the Neuron reset: make the day's share of missing showcase images (each free
# image model draws the same test prompts once) and the missing voice samples (each free TTS model reads the
# same sentences once). Commits nothing once all exist.
on:
  # Started on time by the scheduler Worker (scheduler/schedule.ts); GitHub's cron was unreliable.
  workflow_dispatch:

concurrency:
  group: data-writes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  showcase:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run showcase
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Install ffmpeg (voice samples are stored as small MP3s)
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - run: npm run voices
        if: ${{ !cancelled() }}  # voices don't depend on the images step
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_AI_STUDIO_API_KEY: ${{ secrets.GOOGLE_AI_STUDIO_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          SPEECHIFY_API_KEY: ${{ secrets.SPEECHIFY_API_KEY }}
      - name: Commit new images and voices
        if: ${{ !cancelled() }}
        run: |
          # Nothing exists yet on a day that made no images (e.g. the free Neurons were already used).
          for f in data/showcase.json public/showcase data/voices.json public/voices; do if [ -e "$f" ]; then git add "$f"; fi; done
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git config user.name "freetier-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: showcase $(date -u +%Y-%m-%d)"
          # Code may have been pushed while this job ran: rebase the data commit onto it.
          for attempt in 1 2 3; do git pull --rebase --quiet && git push && exit 0; sleep $((attempt * 10)); done; exit 1

name: Daily tests

# One tiny request per active free model (data/tests/history.json), and one search per
# search API in the morning run (data/tests/search.json).
on:
  # Started on time by the scheduler Worker (scheduler/schedule.ts); GitHub's cron was unreliable.
  workflow_dispatch:
    inputs:
      slot:
        description: "morning (every model + tool calls) or evening (chat only); empty: by the clock"
        required: false
        default: ""
      only:
        description: "Comma-separated provider ids or search API ids to test, or \"search\" for all search APIs (empty: all)"
        required: false
        default: ""

concurrency:
  group: data-writes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  test-models:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run test-models
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_AI_STUDIO_API_KEY: ${{ secrets.GOOGLE_AI_STUDIO_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          SPEECHIFY_API_KEY: ${{ secrets.SPEECHIFY_API_KEY }}
          CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}
          HETZNER_API_KEY: ${{ secrets.HETZNER_API_KEY }}
          REQUESTY_API_KEY: ${{ secrets.REQUESTY_API_KEY }}
          AMD_RADEON_API_KEY: ${{ secrets.AMD_RADEON_API_KEY }}
          BAZAARLINK_API_KEY: ${{ secrets.BAZAARLINK_API_KEY }}
          ORCAROUTER_API_KEY: ${{ secrets.ORCAROUTER_API_KEY }}
          TEST_SLOT: ${{ inputs.slot }}
          TEST_ONLY: ${{ inputs.only }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
      # Search APIs: one search each, morning run only (the script skips the evening run).
      # Never let it block committing the model results.
      - run: npm run test-search
        continue-on-error: true
        env:
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          PARALLEL_API_KEY: ${{ secrets.PARALLEL_API_KEY }}
          LINKUP_API_KEY: ${{ secrets.LINKUP_API_KEY }}
          TEST_SLOT: ${{ inputs.slot }}
          TEST_ONLY: ${{ inputs.only }}
      - run: npm run readme
      - name: Commit results
        run: |
          # Rebases onto data/code that landed meanwhile; README.md is rebuilt, never merged.
          scripts/push-data.sh "data: daily tests $(date -u +%Y-%m-%d)" data README.md

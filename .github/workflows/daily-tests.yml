name: Daily tests

# One tiny request per active free model; results go to data/tests/history.json.
on:
  # Started on time by the scheduler Worker (scheduler/schedule.ts); GitHub's cron was unreliable.
  workflow_dispatch:
    inputs:
      slot:
        description: "morning (every model + tool calls) or evening (chat only); empty: by the clock"
        required: false
        default: ""
      only:
        description: "Comma-separated provider ids to test (empty: all)"
        required: false
        default: ""

concurrency:
  group: data-writes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  test-models:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run test-models
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_AI_STUDIO_API_KEY: ${{ secrets.GOOGLE_AI_STUDIO_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          TEST_SLOT: ${{ inputs.slot }}
          TEST_ONLY: ${{ inputs.only }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
      - run: npm run readme
      - name: Commit results
        run: |
          # Rebases onto data/code that landed meanwhile; README.md is rebuilt, never merged.
          scripts/push-data.sh "data: daily tests $(date -u +%Y-%m-%d)" data README.md

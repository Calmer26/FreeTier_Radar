name: Daily tests

# One tiny request per active free model; results go to data/tests/history.json.
on:
  schedule:
    - cron: "10 6 * * *"
  workflow_dispatch:

concurrency:
  group: data-writes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  test-models:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run test-models
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_AI_STUDIO_API_KEY: ${{ secrets.GOOGLE_AI_STUDIO_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
      - run: npm run readme
      - name: Commit results
        run: |
          git add data README.md
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git config user.name "freetier-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: daily tests $(date -u +%Y-%m-%d)"
          # Code may have been pushed while this job ran: rebase the data commit onto it.
          for attempt in 1 2 3; do git pull --rebase --quiet && git push && exit 0; sleep $((attempt * 10)); done; exit 1
